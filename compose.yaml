services:
  baton-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: ./secrets/server.env
    environment:
      BATON_BIND: 0.0.0.0:8080
      # Caddy's fixed address below, so only Caddy's X-Forwarded-For is trusted.
      TRUSTED_PROXY_CIDRS: 172.28.0.11/32
    volumes:
      - ./data:/data
    networks:
      baton:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10
    environment:
      BATON_DOMAIN: ${BATON_DOMAIN:-baton.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      baton:
        ipv4_address: 172.28.0.11
    depends_on:
      - baton-server
    restart: unless-stopped

networks:
  baton:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
